# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# maven.neoforged.net is frequently reset from mainland China. Gradle retries repository
# access instead of failing the whole build on the first connection reset.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=1000

# If no Java 25 toolchain is auto-detected, point Gradle at one (see docs/SETUP.md):
# org.gradle.java.installations.paths=C:/path/to/jdk-25

# Environment Properties
# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=26.2
# Any release version of Minecraft can be used as a bound.
minecraft_version_range=[26.2]
# The NeoForge version must agree with the Minecraft version.
neo_version=26.2.0.88

## Mod Properties

# Unique mod identifier: lowercase, matches [a-z][a-z0-9_]{1,63}, and must match the
# String constant in the @Mod annotated class.
mod_id=beyondtime
# Human-readable display name.
mod_name=Beyond-Time
# License of the mod. See https://choosealicense.com/.
mod_license=MIT
# Mod version, see https://semver.org/.
mod_version=0.1.0
# Group ID, must match the base package used for the mod sources.
mod_group_id=com.beyondtime
# Authors shown in the mod UI.
mod_authors=
# Short description shown in the mod UI. Keep this file ASCII-only: Gradle reads
# .properties files as ISO-8859-1. Localized text belongs in the lang JSON files.
mod_description=Beyond-Time - a Minecraft archaeology mod about the history of the world: microscopes and microbial samples, ancient DNA, the ancestral forms of living creatures, and machines that travel to the past of each dimension.
