distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# services.gradle.org redirects to github.com, which this machine routes through a local
# accelerator that Java does not trust. The Tencent mirror serves the same zip directly.
# Switch back to https://services.gradle.org/distributions/gradle-9.2.1-bin.zip on a
# machine without that redirect problem.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.2.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
